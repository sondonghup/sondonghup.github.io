name: Build check
on: [pull_request]
jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub Pages 가 master 를 빌드할 때와 같은 방식으로 빌드한다.
      - uses: actions/jekyll-build-pages@v1
      - name: Check generated pages
        run: |
          ls -la _site
          test -f _site/index.html
          test -f _site/dev/index.html
          test -f _site/life/index.html
          test -f _site/aboutme/index.html || test -f _site/aboutme.html
          test -f _site/404.html
